<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atelier Federici | Altea</title>
  
  <!-- Tipografías elegantes Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f7f6f2;
      --card-bg: #ffffff;
      --noir: #111111;
      --charcoal: #2b2b2b;
      --muted: #767676;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --gold-accent: #c4a47c;
      --radius-squircle: 22px;
      --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 16px 36px rgba(0, 0, 0, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--noir);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    /* Contenedor central simulando pantalla móvil elegante */
    .app-viewport {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.04);
      padding-bottom: 40px;
    }

    /* Cabecera / Banner editorial */
    .hero-banner {
      position: relative;
      height: 210px;
      background: linear-gradient(145deg, #161616 0%, #262626 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Textura gráfica de fondo */
    .hero-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 16px 16px;
    }

    /* Arte de la bailarina integrado en el banner */
    .hero-artwork {
      position: absolute;
      right: 18px;
      bottom: -15px;
      height: 220px;
      opacity: 0.88;
      filter: invert(1) brightness(1.2);
      pointer-events: none;
      transform: rotate(3deg);
    }

    .hero-badge-location {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f5f5f5;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* Avatar superpuesto */
    .avatar-wrapper {
      position: relative;
      margin-top: -55px;
      display: flex;
      justify-content: center;
      z-index: 2;
    }

    .avatar-circle {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: #ffffff;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #faf9f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }

    .avatar-inner img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* Encabezado editorial */
    .profile-info {
      text-align: center;
      padding: 16px 24px 8px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--noir);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold-accent);
      margin-top: 6px;
    }

    .divider-gold {
      width: 36px;
      height: 2px;
      background: var(--gold-accent);
      margin: 14px auto;
      border-radius: 2px;
    }

    .brand-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.12rem;
      color: var(--charcoal);
      line-height: 1.4;
      max-width: 320px;
      margin: 0 auto;
    }

    /* Cuadrícula de iconos interactivos (estilo iOS squircle) */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 12px;
      padding: 24px 22px 16px;
    }

    .shortcut-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--noir);
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .shortcut-card:active {
      transform: scale(0.92);
    }

    .icon-box {
      width: 68px;
      height: 68px;
      border-radius: var(--radius-squircle);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: var(--shadow-soft);
      position: relative;
      transition: all 0.2s ease;
    }

    .shortcut-card:hover .icon-box {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .icon-box svg {
      width: 30px;
      height: 30px;
    }

    .shortcut-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--charcoal);
      letter-spacing: 0.3px;
      text-align: center;
    }

    /* Colores e iconos de los botones */
    .icon-google {
      background: linear-gradient(135deg, #1f1f1f 0%, #000000 100%);
      color: #f7d070;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
    }

    .icon-web {
      background: linear-gradient(135deg, #2b2927 0%, #171514 100%);
      color: #ffffff;
    }

    .icon-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #ffffff;
    }

    .icon-phone {
      background: linear-gradient(135deg, #1b3a57 0%, #0e2030 100%);
      color: #ffffff;
    }

    .icon-maps {
      background: linear-gradient(135deg, #a63f38 0%, #7d2621 100%);
      color: #ffffff;
    }

    /* Botón destacado Guardar Contacto */
    .action-cta-area {
      padding: 10px 22px 20px;
    }

    .btn-save-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--noir);
      color: #ffffff;
      border: none;
      padding: 15px 20px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-save-contact:active {
      transform: scale(0.97);
      background: #252525;
    }

    .btn-save-contact svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* Pie de página */
    .brand-footer {
      text-align: center;
      padding: 14px 20px 0;
      border-top: 1px solid var(--border-subtle);
      margin-top: auto;
    }

    .footer-address {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.8px;
      line-height: 1.5;
    }

    .footer-signature {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--gold-accent);
      margin-top: 4px;
    }

    /* Notificación de feedback */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(17, 17, 17, 0.95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      pointer-events: none;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <main class="app-viewport">
    
    <!-- Hero Banner con Bailarina minimalista -->
    <header class="hero-banner">
      <div class="hero-pattern"></div>
      <span class="hero-badge-location">Altea · España</span>
      
      <!-- Silueta de la bailarina minimalista vectorizada -->
      <svg class="hero-artwork" viewBox="0 0 240 450" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Cabeza y cuello -->
        <path d="M125 15 L145 28 L135 60 L120 40 Z" />
        <path d="M135 60 L130 95" />
        <!-- Brazo derecho -->
        <path d="M145 70 L195 180 L225 240" stroke-width="4" />
        <!-- Brazo izquierdo -->
        <path d="M115 75 L65 145" stroke-width="4" />
        <!-- Torso plisado estilo vestido alta costura -->
        <path d="M110 95 L112 145" />
        <path d="M122 80 L124 145" />
        <path d="M134 85 L136 145" />
        <path d="M146 95 L148 145" />
        <!-- Cinturón fajín -->
        <path d="M85 145 L155 148" stroke-width="6" />
        <path d="M95 152 L150 155" stroke-width="5" />
        <!-- Falda hojas/pétalos fluidos -->
        <path d="M120 155 C70 180 30 250 35 280 C60 270 95 210 115 165" />
        <path d="M120 160 C75 220 55 330 75 350 C100 320 125 240 126 170" />
        <path d="M125 160 C110 230 115 320 135 340 C145 290 148 230 130 165" />
        <path d="M128 160 C145 200 190 280 195 245 C185 205 155 175 130 160" />
        <path d="M125 160 C150 170 205 210 200 230 C175 225 145 185 125 160" />
        <!-- Pierna estilizada extendida -->
        <path d="M122 170 L105 280 L125 365 L155 490" stroke-width="4.5" />
      </svg>
    </header>

    <!-- Avatar central con el Logotipo Atelier Federici -->
    <div class="avatar-wrapper">
      <div class="avatar-circle">
        <div class="avatar-inner">
          <!-- Logo Atelier Federici Vectorizado en SVG -->
          <svg viewBox="0 0 400 240" fill="none" style="width: 100%; height: auto;">
            <!-- Tipografía ATELIER -->
            <text x="35" y="150" font-family="'Montserrat', sans-serif" font-size="28" font-weight="600" letter-spacing="9" fill="#111">ATELIER</text>
            <!-- Caligrafía Federici -->
            <path d="M175 110 C140 105 95 65 140 32 C170 12 185 30 192 65 C198 100 185 190 180 230" stroke="#111" stroke-width="8" stroke-linecap="round" fill="none" />
            <path d="M152 135 L225 130" stroke="#111" stroke-width="7" stroke-linecap="round" />
            <text x="215" y="152" font-family="'Cormorant Garamond', cursive" font-size="62" font-style="italic" font-weight="600" fill="#111">ederici</text>
          </svg>
        </div>
      </div>
    </div>

    <!-- Título y Eslogan -->
    <section class="profile-info">
      <h1 class="brand-title">Atelier Federici</h1>
      <p class="brand-subtitle">Moda & Estilismo · Altea</p>
      <div class="divider-gold"></div>
      <p class="brand-tagline">«Usa el outfit, tú eres la ocasión»</p>
    </section>

    <!-- Cuadrícula 2x3 de Accesos Directos (iOS Style) -->
    <nav class="shortcuts-grid">
      
      <!-- 1. Reseña Google (Directa a 5 estrellas con Place ID) -->
      <a href="https://search.google.com/local/writereview?placeid=ChIJT-Bvz3wBYg0Ro7lH4gXdeiw" target="_blank" rel="noopener noreferrer" class="shortcut-card">
        <div class="icon-box icon-google">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
          </svg>
        </div>
        <span class="shortcut-label">Reseña</span>
      </a>

      <!-- 2. Instagram -->
      <a href="https://www.instagram.com/atelierfederici/" target="_blank" rel="noopener noreferrer" class="shortcut-card">
        <div class="icon-box icon-instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </div>
        <span class="shortcut-label">Instagram</span>
      </a>

      <!-- 3. Tienda Online -->
      <a href="https://atelierfederici.com/" target="_blank" rel="noopener noreferrer" class="shortcut-card">
        <div class="icon-box icon-web">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span class="shortcut-label">Boutique</span>
      </a>

      <!-- 4. WhatsApp Directo -->
      <a href="https://wa.me/34604467780?text=Hola%20Atelier%20Federici,%20os%20contacto%20desde%20el%20llavero%20digital." target="_blank" rel="noopener noreferrer" class="shortcut-card">
        <div class="icon-box icon-whatsapp">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.25-.75-.67-1.26-1.5-1.41-1.75-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.18-.47-.3z"/>
          </svg>
        </div>
        <span class="shortcut-label">WhatsApp</span>
      </a>

      <!-- 5. Llamada Telefónica -->
      <a href="tel:+34604467780" class="shortcut-card">
        <div class="icon-box icon-phone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </div>
        <span class="shortcut-label">Llamar</span>
      </a>

      <!-- 6. Ubicación / Cómo llegar -->
      <a href="https://maps.google.com/?q=Calle+Conde+de+Altea+35,+03590+Altea,+Alicante" target="_blank" rel="noopener noreferrer" class="shortcut-card">
        <div class="icon-box icon-maps">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <span class="shortcut-label">Cómo llegar</span>
      </a>

    </nav>

    <!-- Botón de acción: Guardar en la agenda -->
    <div class="action-cta-area">
      <button class="btn-save-contact" id="saveContactBtn">
        <svg viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        Guardar Contacto
      </button>
    </div>

    <!-- Pie de página de la marca -->
    <footer class="brand-footer">
      <p class="footer-address">Calle Conde de Altea, 35 · 03590 Altea (Alicante)</p>
      <p class="footer-signature">Atelier Federici Haute Couture</p>
    </footer>

  </main>

  <div class="toast-msg" id="toastMsg">Contacto descargado</div>

  <script>
    // Generador automático de archivo vCard (.vcf) para añadir a contactos del teléfono
    document.getElementById('saveContactBtn').addEventListener('click', function() {
      const vCardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Atelier Federici',
        'ORG:Atelier Federici',
        'TITLE:Moda & Estilismo',
        'TEL;TYPE=CELL,VOICE:+34604467780',
        'ADR;TYPE=WORK:;;Calle Conde de Altea 35;Altea;Alicante;03590;España',
        'URL:https://atelierfederici.com',
        'NOTE:Usa el outfit, tú eres la ocasión',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Atelier_Federici.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // Mostrar toast de confirmación
      const toast = document.getElementById('toastMsg');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    });
  </script>
</body>
</html>
