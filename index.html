<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Federici</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      margin: 0;
      padding: 20px;
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 16px;
      object-fit: cover;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 24px 0;
      color: #212529;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 320px;
      padding: 16px 20px;
      margin-bottom: 14px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-google {
      background-color: #ffffff;
      color: #1a73e8;
      border: 1px solid #dadce0;
    }
    .btn-instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Sustituye la URL de la imagen por el logo de la tienda -->
  <img src="logo.png" alt="Logo" class="logo">
  <h1>Atelier Federici</h1>

  <a href="https://search.google.com/local/writereview?placeid=ChIJT-Bvz3wBYg0Ro7lH4gXdeiw" class="btn btn-google">
    ⭐ Déjanos una reseña en Google
  </a>

  <a href="https://www.instagram.com/TU_USUARIO/" class="btn btn-instagram">
    📸 Síguenos en Instagram
  </a>
</body>
</html>
